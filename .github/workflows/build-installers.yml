name: Build Balaji FeeHub Windows Installers

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------- Diagnostics (as requested) --------
      - name: Print diagnostic paths
        run: |
          Write-Host "cwd                : $(Get-Location)"
          Write-Host "github.workspace   : ${{ github.workspace }}"
          $iss1  = Join-Path "${{ github.workspace }}" "installer-sources\BalajiFeeHub-Server-Setup.iss"
          $iss2  = Join-Path "${{ github.workspace }}" "installer-sources\BalajiFeeHub-Client-Setup.iss"
          $iscc  = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          Write-Host "server iss path    : $iss1"
          Write-Host "client iss path    : $iss2"
          Write-Host "iscc path          : $iscc"
          Write-Host "Test-Path server   : $(Test-Path $iss1)"
          Write-Host "Test-Path client   : $(Test-Path $iss2)"
          Write-Host ""
          Write-Host "Repo tree at installer-sources/:"
          Get-ChildItem -Path "${{ github.workspace }}\installer-sources" -Force | Format-Table Name,Length -AutoSize

      - name: Install Inno Setup 6
        shell: cmd
        run: choco install innosetup -y --no-progress

      - name: Verify ISCC.exe exists
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          Write-Host "Test-Path ISCC.exe : $(Test-Path $iscc)"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after chocolatey install." }

      - name: Download prebuilt payload from Emergent preview
        run: |
          $base = "https://finance-hub-school.preview.emergentagent.com/downloads"
          $work = Join-Path "${{ github.workspace }}" "installer-sources\payload"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          foreach ($f in @(
            "BalajiConventFeeSoftware_v1.0_CORE.zip",
            "mongodb-windows-x86_64.msi.001",
            "mongodb-windows-x86_64.msi.002"
          )) {
            Write-Host "Downloading $f ..."
            Invoke-WebRequest "$base/$f" -OutFile (Join-Path $work $f)
          }

      - name: Verify SHA-256 checksums
        run: |
          $work = Join-Path "${{ github.workspace }}" "installer-sources\payload"
          $lines = (Invoke-WebRequest "https://finance-hub-school.preview.emergentagent.com/downloads/SHA256SUM.txt").Content -split "`n"
          foreach ($line in $lines) {
            if ($line -match "^([0-9a-f]{64})\s+(.+)$") {
              $expected = $Matches[1].ToLower()
              $file     = $Matches[2].Trim()
              $path     = Join-Path $work $file
              if (Test-Path $path) {
                $got = (Get-FileHash $path -Algorithm SHA256).Hash.ToLower()
                if ($got -ne $expected) { throw "SHA-256 mismatch on $file ($got != $expected)" }
                Write-Host "sha256 OK  $file"
              }
            }
          }

      - name: Extract CORE.zip into installer-sources/payload/BalajiConventFeeSoftware-v1.0/
        run: |
          $work = Join-Path "${{ github.workspace }}" "installer-sources\payload"
          $core = Join-Path $work "BalajiConventFeeSoftware_v1.0_CORE.zip"
          $dest = Join-Path $work "BalajiConventFeeSoftware-v1.0"
          Expand-Archive -Force $core -DestinationPath $dest
          Write-Host "Extracted to $dest"

      - name: Recombine MongoDB MSI parts and clean up
        shell: cmd
        run: |
          set WORK=${{ github.workspace }}\installer-sources\payload
          set SVC=%WORK%\BalajiConventFeeSoftware-v1.0\05-services
          copy /y "%WORK%\mongodb-windows-x86_64.msi.001" "%SVC%\mongodb-windows-x86_64.msi.001"
          copy /y "%WORK%\mongodb-windows-x86_64.msi.002" "%SVC%\mongodb-windows-x86_64.msi.002"
          copy /b "%SVC%\mongodb-windows-x86_64.msi.001" + "%SVC%\mongodb-windows-x86_64.msi.002" "%SVC%\mongodb-windows-x86_64.msi"
          del "%SVC%\mongodb-windows-x86_64.msi.001" "%SVC%\mongodb-windows-x86_64.msi.002"
          del "%WORK%\mongodb-windows-x86_64.msi.001" "%WORK%\mongodb-windows-x86_64.msi.002"
          del "%WORK%\BalajiConventFeeSoftware_v1.0_CORE.zip"
          dir "%SVC%\mongodb-windows-x86_64.msi"

      - name: Set up Python 3.11 x64 (for offline wheelhouse rebuild)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Overlay repo-tracked installer scripts onto payload
        run: |
          $payload = Join-Path "${{ github.workspace }}" "installer-sources\payload\BalajiConventFeeSoftware-v1.0"
          $srcRoot = Join-Path "${{ github.workspace }}" "installer-sources\scripts"
          # Map source of truth -> destination inside the extracted payload
          $overlays = @(
            @{ src = "install-main-server.bat"; dst = "01-install-main-server\install-main-server.bat" },
            @{ src = "repair-installation.bat"; dst = "01-install-main-server\repair-installation.bat" },
            @{ src = "install-client-pc.bat";   dst = "02-install-client-pc\install-client-pc.bat"     }
          )
          foreach ($o in $overlays) {
            $s = Join-Path $srcRoot $o.src
            $d = Join-Path $payload $o.dst
            if (-not (Test-Path $s)) { throw "Missing repo source-of-truth: $s" }
            if (-not (Test-Path (Split-Path $d))) { throw "Missing target folder inside payload: $(Split-Path $d)" }
            Copy-Item -Force $s $d
            Write-Host "Overlaid $($o.src) -> $d"
          }

      - name: Rebuild offline wheelhouse (native Windows Python 3.11 x64)
        run: |
          $payload = Join-Path "${{ github.workspace }}" "installer-sources\payload\BalajiConventFeeSoftware-v1.0"
          $req     = Join-Path $payload "03-source-code\backend\requirements.txt"
          $wheels  = Join-Path $payload "01-install-main-server\wheels"
          Write-Host "Python  : $(python --version)"
          Write-Host "Machine : $(python -c 'import platform; print(platform.machine())')"
          Write-Host "Reqs    : $req"
          Write-Host "Wheels  : $wheels"
          if (-not (Test-Path $req)) { throw "requirements.txt not found at $req" }
          if (Test-Path $wheels) { Remove-Item -Recurse -Force $wheels }
          New-Item -ItemType Directory -Path $wheels | Out-Null
          python -m pip install --upgrade pip wheel setuptools
          # Downloading on native Windows Python 3.11 x64 resolves environment
          # markers correctly (sys_platform=="win32", python_version=="3.11"),
          # so colorama, tzdata, six and every other transitive dep are included.
          python -m pip download --dest "$wheels" --only-binary=:all: -r "$req"
          if ($LASTEXITCODE -ne 0) { throw "pip download failed with exit $LASTEXITCODE" }
          # Bundle pip/wheel/setuptools too so the offline installer never needs PyPI.
          python -m pip download --dest "$wheels" --only-binary=:all: pip wheel setuptools
          $count = (Get-ChildItem $wheels).Count
          Write-Host ""
          Write-Host "Rebuilt wheelhouse: $count wheel files"
          if ($count -lt 40) { throw "Wheelhouse suspiciously small ($count files) - aborting build" }
          Get-ChildItem $wheels | Sort-Object Name | Select-Object Name,Length | Format-Table -AutoSize

      - name: Verify offline wheelhouse installs into a clean venv
        run: |
          $payload = Join-Path "${{ github.workspace }}" "installer-sources\payload\BalajiConventFeeSoftware-v1.0"
          $req     = Join-Path $payload "03-source-code\backend\requirements.txt"
          $wheels  = Join-Path $payload "01-install-main-server\wheels"
          $venv    = Join-Path "${{ github.workspace }}" "_verify_venv"
          if (Test-Path $venv) { Remove-Item -Recurse -Force $venv }
          python -m venv $venv
          $vpy = Join-Path $venv "Scripts\python.exe"
          & $vpy -m pip install --upgrade --no-index --find-links "$wheels" pip
          if ($LASTEXITCODE -ne 0) { throw "OFFLINE VERIFY: pip self-upgrade failed with exit $LASTEXITCODE" }
          & $vpy -m pip install --no-index --find-links "$wheels" -r "$req"
          if ($LASTEXITCODE -ne 0) { throw "OFFLINE VERIFY: pip install -r requirements.txt failed with exit $LASTEXITCODE" }
          Write-Host ""
          Write-Host "Verifying imports of critical production packages..."
          & $vpy -c "import fastapi, uvicorn, motor, pymongo, pydantic, jwt, bcrypt, cryptography, pandas, numpy, openpyxl, dotenv, requests; print('All 13 imports OK')"
          if ($LASTEXITCODE -ne 0) { throw "OFFLINE VERIFY: critical package import test failed with exit $LASTEXITCODE" }
          # Start the backend against a stub Mongo (won't actually connect, but must at
          # least import server.py without ImportError).
          $backend = Join-Path $payload "03-source-code\backend"
          Push-Location $backend
          try {
            & $vpy -c "import sys; sys.path.insert(0, '.'); import importlib; importlib.import_module('server'); print('backend server.py imports OK')"
            if ($LASTEXITCODE -ne 0) { Write-Warning "backend server.py import returned $LASTEXITCODE (non-fatal - env may need MONGO_URL). Continuing." }
          } finally {
            Pop-Location
          }
          Write-Host ""
          Write-Host "==============================================================="
          Write-Host "  OFFLINE WHEELHOUSE VERIFIED - installer is safe to publish."
          Write-Host "==============================================================="

      - name: Generate school-logo.ico from source JPEG
        run: |
          $work = Join-Path "${{ github.workspace }}" "installer-sources\payload"
          $jpg  = Join-Path $work "BalajiConventFeeSoftware-v1.0\03-source-code\frontend\public\school-logo.jpeg"
          $ico  = Join-Path "${{ github.workspace }}" "installer-sources\school-logo.ico"
          Write-Host "JPEG source : $jpg"
          Write-Host "ICO target  : $ico"
          if (-not (Test-Path $jpg)) { throw "Source JPEG not found at $jpg" }
          # ImageMagick is preinstalled on windows-latest runners
          & magick "$jpg" -background white -alpha remove -alpha off -resize 256x256 -define icon:auto-resize=256,128,64,48,32,16 "$ico"
          if (-not (Test-Path $ico)) { throw "Failed to generate school-logo.ico" }
          Write-Host "Generated ICO size: $((Get-Item $ico).Length) bytes"

      - name: Validate compile prerequisites (paths, payload, icon)
        run: |
          $ws     = "${{ github.workspace }}"
          $srvIss = Join-Path $ws "installer-sources\BalajiFeeHub-Server-Setup.iss"
          $cliIss = Join-Path $ws "installer-sources\BalajiFeeHub-Client-Setup.iss"
          $ico    = Join-Path $ws "installer-sources\school-logo.ico"
          $pldSrv = Join-Path $ws "installer-sources\payload\BalajiConventFeeSoftware-v1.0"
          $pldCli = Join-Path $ws "installer-sources\payload\BalajiConventFeeSoftware-v1.0\02-install-client-pc"
          $iscc   = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          Write-Host "Test-Path server iss   : $(Test-Path $srvIss)"
          Write-Host "Test-Path client iss   : $(Test-Path $cliIss)"
          Write-Host "Test-Path school-logo  : $(Test-Path $ico)"
          Write-Host "Test-Path payload/full : $(Test-Path $pldSrv)"
          Write-Host "Test-Path payload/cli  : $(Test-Path $pldCli)"
          Write-Host "Test-Path ISCC.exe     : $(Test-Path $iscc)"
          if (-not (Test-Path $srvIss)) { throw "Missing $srvIss" }
          if (-not (Test-Path $cliIss)) { throw "Missing $cliIss" }
          if (-not (Test-Path $ico))    { throw "Missing $ico" }
          if (-not (Test-Path $pldSrv)) { throw "Missing $pldSrv" }
          if (-not (Test-Path $pldCli)) { throw "Missing $pldCli" }
          if (-not (Test-Path $iscc))   { throw "Missing $iscc" }
          Write-Host ""
          Write-Host "Contents of payload/BalajiConventFeeSoftware-v1.0 (top level):"
          Get-ChildItem $pldSrv -Force | Format-Table Name,Length -AutoSize

      - name: Compile Server installer
        working-directory: ${{ github.workspace }}\installer-sources
        shell: cmd
        run: |
          echo === cd is: %CD% ===
          dir BalajiFeeHub-Server-Setup.iss
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" BalajiFeeHub-Server-Setup.iss

      - name: Compile Client installer
        working-directory: ${{ github.workspace }}\installer-sources
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" BalajiFeeHub-Client-Setup.iss

      - name: Compute SHA-256 for both EXEs
        run: |
          $out = Join-Path "${{ github.workspace }}" "installer-sources\Output"
          Write-Host "Output dir: $out"
          Get-ChildItem $out
          $sums = foreach ($e in "BalajiFeeHub-Server-Setup.exe","BalajiFeeHub-Client-Setup.exe") {
            $p = Join-Path $out $e
            $h = (Get-FileHash $p -Algorithm SHA256).Hash.ToLower()
            $s = (Get-Item $p).Length
            "{0}  {1}    ({2:N0} bytes)" -f $h,$e,$s
          }
          $sums -join "`n" | Set-Content (Join-Path $out "SHA256SUMS.txt")
          Write-Host ""
          Get-Content (Join-Path $out "SHA256SUMS.txt")

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BalajiFeeHub-Installers
          path: |
            installer-sources/Output/BalajiFeeHub-Server-Setup.exe
            installer-sources/Output/BalajiFeeHub-Client-Setup.exe
            installer-sources/Output/SHA256SUMS.txt
          retention-days: 90
